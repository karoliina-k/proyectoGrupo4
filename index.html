<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inmobiliaria</title>
    
    <link rel="stylesheet" href="style.css"

</head>
<body>

<form action="/login" method="post">

    <h2>Inicio de sesión</h2>

    <div>
       <label for="username">Usuario o mail</label> 
       <input type="text" id="username" name="username" placeholder="ejemplo Juan"></input>
    </div>
    
    <div>
       <label for="password">Contraseña</label> 
       <input type="password" id="password" name="password" placeholder="**********************" required></input>
    </div>
   
    <div>
    <p>Si no tienes cuenta <a href="/registro">regístrate</a></p>
    <p><a href="/recuperar-contrasena">Recuperar contraseña</a></p>
    </div>

    <button type="submit">Iniciar sesión</button>

</form>
    
</body>
</html>
